<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="VolkBuster Video">
  <!-- The house board. Colours mirror src/logo-spec.ts (VOLKBUSTER_BLUE /
       VOLKBUSTER_CREAM); the pre-fork favicon had drifted to an older
       emerald/gold palette that no longer matched anything in the app.
       textLength pins the wordmark's width so it fits the inner keyline even
       when Archivo Black has not loaded and Arial Black stands in — a ten
       letter name has no slack a seven letter one had. -->
  <rect x="20" y="60" width="600" height="280" rx="34" fill="#1a49c2"/>
  <rect x="48" y="88" width="544" height="224" rx="22" fill="none" stroke="#f2e8c9" stroke-width="7"/>
  <text x="320" y="208" text-anchor="middle" font-family="'Archivo Black','Arial Black',sans-serif"
        font-size="74" fill="#f2e8c9" textLength="486" lengthAdjust="spacingAndGlyphs">VOLKBUSTER</text>
  <text x="566" y="286" text-anchor="end" font-family="'Archivo Black','Arial Black',sans-serif"
        font-size="40" fill="#f2e8c9">VIDEO</text>
</svg>
