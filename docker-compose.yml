# VolkBuster Video — a Plex-gated 1990s video store.
#
#   docker compose up -d
#   open http://<nas-ip>:3355
#
# Upgrading from before the container was renamed volkbusters? Run
#   docker compose up -d --remove-orphans
# once, so the old volkbuster container gives up ports 3355 and 3366. The data
# volume is untouched either way.
#
# ONE INTERNET-FACING PORT. Two are published below — 3355 for the front door,
# 3366 for the owner's console on the LAN — but only 3355 should ever be routed
# in from outside. The store app runs on loopback INSIDE the container and is
# reachable only through the front door, which checks a Plex session first.
# That is the whole security model: the store has no authentication of its own,
# so publishing its port would serve the entire library to anyone who found it.
# Do not add a mapping for APP_PORT.

services:
  volkbusters:
    image: ghcr.io/vanticstudio/volk-buster-video:latest
    # Or build from a clone instead of pulling:
    #   build: .
    container_name: volkbusters
    restart: unless-stopped
    init: true

    ports:
      # host:container. Change the LEFT number to move it on your NAS; leave the
      # right one alone unless you also change PORT below.
      - "3355:3355"
      # The management console: library visibility, the games department, and
      # signing every viewer out. Bound to the LAN deliberately — do NOT put
      # this one behind a tunnel or forward it from a router. It still requires
      # a Plex sign-in and the server's owner, so the LAN is not the only lock,
      # but it should not be reachable from outside at all.
      - "3366:3366"

    # Bridge networking on purpose, unlike upstream, which used host networking
    # so Remote Play's WebRTC could offer the machine's real LAN address. That
    # trade bought streaming at the cost of every port isolation the daemon
    # provides — on a box that also holds the Plex library. Remote Play is not
    # wired into the gate yet, so the isolation is worth more today. Revisit
    # when per-user rendering instances land.

    environment:
      # NOTHING IS REQUIRED HERE. The session-signing and token-encryption keys
      # are generated on first boot and stored beside the database; the Plex
      # server is chosen in the browser during setup. After `up -d`, read the
      # setup code with:  docker logs volkbusters | grep -i "setup code"
      #
      # Set PLEX_MACHINE_ID / SESSION_SECRET / TOKEN_ENCRYPTION_KEY only if you
      # manage secrets externally; env wins over the generated values.
      PORT: "3355"
      APP_PORT: "1420"
      ADMIN_PORT: "3366"   # set to 0 to switch the console off
      # Trust the proxy's client-IP header for per-caller rate limiting.
      # Safe here because only the proxy can reach the published port; off
      # by default because a forgeable key gives an attacker unlimited
      # buckets, which is worse than one shared limit.
      TRUST_PROXY_HEADERS: "1"
      DATABASE_PATH: "/data/store.db"
      # How long before a signed-in viewer must authenticate again (30 days).
      SESSION_TTL_MS: "2592000000"
      # The revocation window: unshare a Plex library and that person loses
      # access within this long, rather than whenever their session expires.
      REVALIDATE_AFTER_MS: "86400000"

    volumes:
      # Sessions, per-user store settings and encrypted Plex tokens. Back this
      # up like a credential store, because that is what it is.
      - volkbuster-data:/data
      # Your brand: drop a logo.svg in here and restart. Bind-mounted rather
      # than baked into the image, so rebranding needs no rebuild.
      - ./public/user-assets:/app/dist/user-assets

    # Plex reachability: if Plex is another container on this host, add its
    # network here. If Plex runs on the host itself, the container reaches it at
    # the host's LAN IP (or host.docker.internal on Docker Desktop).

    healthcheck:
      # Probes the PUBLIC port, so the check fails if the gate is down even when
      # the store behind it is fine.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3355/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  volkbuster-data:
