<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="VolkBuster Video — your Plex library as a 1990s video store">
  <!--
    The social share card: 1200x630, the size every link unfurler crops to.

    THIS IS THE FIRST THING ANYONE SEES. The store lives behind a Plex gate, so
    a person who has been sent the link cannot look at it before signing in —
    the preview in the chat window is the whole shopfront until they do. It
    therefore has to say what the thing IS, not just carry a logo.

    Rendered to PNG by tools/gen-share-image.mjs. Authored as SVG rather than
    screenshotted from the running store for the same reason the app icon is:
    a screenshot goes stale the moment the brand changes, and cropping a 3D
    scene to 1.91:1 gives an unreadable smear at the ~300px wide it is actually
    displayed at.

    Wide lockup, not the icon's stacked one — at this aspect a square mark
    letterboxes into a third of the frame and wastes the rest.

    textLength pins each line to a measure so the card survives Archivo Black
    being unavailable to whatever renders it, the same trick the icon uses.
  -->

  <defs>
    <!-- The sign is lit; the rest of the street is not. -->
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1a49c2" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#1a49c2" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#1a49c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d1018"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- The storefront board -->
  <rect x="180" y="86" width="840" height="286" rx="26" fill="#1a49c2"/>
  <rect x="208" y="114" width="784" height="230" rx="13" fill="none" stroke="#f2e8c9" stroke-width="8"/>
  <text x="600" y="248" text-anchor="middle"
        font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="112"
        fill="#f2e8c9" textLength="672" lengthAdjust="spacingAndGlyphs">VOLKBUSTER</text>
  <text x="600" y="312" text-anchor="middle"
        font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="38"
        fill="#f2e8c9" fill-opacity=".92" textLength="240" lengthAdjust="spacingAndGlyphs">VIDEO</text>

  <!-- What it actually is. Sentence case would read as a caption; this reads
       as the strip of vinyl lettering under a real shop sign. -->
  <text x="600" y="437" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="29" font-weight="600" letter-spacing="5.5"
        fill="#f2e8c9" fill-opacity=".82">YOUR PLEX LIBRARY, AS A VIDEO STORE</text>

  <text x="600" y="486" text-anchor="middle"
        font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="19" font-weight="500" letter-spacing="4.2"
        fill="#f2e8c9" fill-opacity=".42">MEMBERS ONLY — SIGN IN WITH PLEX</text>

  <!-- Shelf edge. Grounds the card and reads as texture at thumbnail size,
       where the individual spines are below the resolution to resolve. -->
  <rect x="0" y="546" width="1200" height="3" fill="#f2e8c9" opacity=".16"/>
  <g>
    <rect x="0" y="552" width="34" height="78" fill="#22304a"/>
    <rect x="38" y="557" width="26" height="73" fill="#3a2b34"/>
    <rect x="68" y="554" width="41" height="76" fill="#35304a"/>
    <rect x="72" y="568" width="33" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="113" y="560" width="22" height="70" fill="#2f4472"/>
    <rect x="139" y="555" width="31" height="75" fill="#4a3320"/>
    <rect x="174" y="552" width="37" height="78" fill="#1f2b3d"/>
    <rect x="215" y="558" width="24" height="72" fill="#1a49c2"/>
    <rect x="243" y="553" width="45" height="77" fill="#26414a"/>
    <rect x="247" y="567" width="37" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="292" y="556" width="28" height="74" fill="#22304a"/>
    <rect x="324" y="559" width="33" height="71" fill="#3a2b34"/>
    <rect x="361" y="554" width="20" height="76" fill="#35304a"/>
    <rect x="385" y="552" width="39" height="78" fill="#2f4472"/>
    <rect x="428" y="557" width="27" height="73" fill="#4a3320"/>
    <rect x="432" y="571" width="19" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="459" y="555" width="43" height="75" fill="#1f2b3d"/>
    <rect x="506" y="560" width="23" height="70" fill="#1a49c2"/>
    <rect x="533" y="553" width="36" height="77" fill="#26414a"/>
    <rect x="573" y="558" width="30" height="72" fill="#22304a"/>
    <rect x="607" y="556" width="25" height="74" fill="#3a2b34"/>
    <rect x="611" y="570" width="17" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="636" y="552" width="42" height="78" fill="#35304a"/>
    <rect x="682" y="559" width="29" height="71" fill="#2f4472"/>
    <rect x="715" y="554" width="35" height="76" fill="#4a3320"/>
    <rect x="754" y="557" width="21" height="73" fill="#1f2b3d"/>
    <rect x="779" y="555" width="38" height="75" fill="#1a49c2"/>
    <rect x="783" y="569" width="30" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="821" y="553" width="26" height="77" fill="#26414a"/>
    <rect x="851" y="560" width="32" height="70" fill="#22304a"/>
    <rect x="887" y="552" width="40" height="78" fill="#3a2b34"/>
    <rect x="931" y="556" width="24" height="74" fill="#35304a"/>
    <rect x="959" y="558" width="44" height="72" fill="#2f4472"/>
    <rect x="963" y="572" width="36" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="1007" y="554" width="27" height="76" fill="#4a3320"/>
    <rect x="1038" y="559" width="34" height="71" fill="#1f2b3d"/>
    <rect x="1076" y="553" width="22" height="77" fill="#1a49c2"/>
    <rect x="1102" y="555" width="37" height="75" fill="#26414a"/>
    <rect x="1143" y="557" width="31" height="73" fill="#22304a"/>
    <rect x="1147" y="571" width="23" height="7" fill="#f2e8c9" opacity=".5"/>
    <rect x="1178" y="552" width="28" height="78" fill="#3a2b34"/>
  </g>
</svg>
