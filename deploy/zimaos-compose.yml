# VolkBuster Video — ZimaOS "Install Custom App" → YAML tab.
#
# Paste this whole file into the YAML tab and hit Install. Nothing to fill in.
#
# YOUR DATA LIVES IN /DATA/AppData/volkbuster, where the Files app can see it.
# The README's YAML and its docker run command keep data in the
# volkbuster-data volume instead. The two do not share data, so switching from
# one to the other opens an empty store.
#
# NOTHING TO BUILD, NOTHING TO CLONE. The image is published to GHCR by
# .github/workflows/publish-image.yml on every push to main, multi-arch
# (amd64 + arm64). Paste this, hit Install, done.
#
# ONE-TIME, ON GITHUB: the first push creates the package PRIVATE, and a private
# package cannot be pulled anonymously. Open
#   https://github.com/users/vanticstudio/packages/container/volk-buster-video/settings
# and set visibility to Public. Until you do, `docker pull` 403s and ZimaOS
# reports the image as not found.
#
# TO UPDATE: push to main, wait for the Actions run, then hit restart (or
# re-pull) in ZimaOS. Your data survives — sessions, the chosen Plex server and
# the generated keys live in the volume below, which is reattached rather than
# recreated, so nobody signs in again and setup is not repeated.
#
# ONE INTERNET-FACING PORT. Two are published below: 3355, the front door, and
# 3366, the owner's console — LAN only, never forwarded in. The store app runs
# on loopback inside the container and is reachable only through the front door,
# which checks a Plex session first. The store has no authentication of its own,
# so do NOT add a mapping for 1420 — that would serve your whole library to
# anyone who found the port.

name: volkbusters

services:
  volkbusters:
    image: ghcr.io/vanticstudio/volk-buster-video:latest
    container_name: volkbusters
    restart: unless-stopped
    init: true

    ports:
      - "3355:3355"
      # Management console — LAN only. Never expose this one publicly.
      - "3366:3366"

    environment:
      # NOTHING IS REQUIRED HERE. The session-signing and token-encryption keys
      # are random bytes the server generates on first boot and keeps beside the
      # database — a machine makes better ones than a human can, and there is
      # nothing to paste, leak or lose. Which Plex server the store gates on is
      # chosen in the browser, from a list of the servers you own.
      #
      # After installing, read the setup code from the log:
      #   docker logs volkbusters | grep -i "setup code"
      # then open the app and follow it.
      #
      # Set PLEX_MACHINE_ID / SESSION_SECRET / TOKEN_ENCRYPTION_KEY here only if
      # you manage secrets externally; env wins over the generated values.
      PORT: "3355"
      APP_PORT: "1420"
      ADMIN_PORT: "3366"   # 0 switches the console off
      # Trust the proxy's client-IP header for per-caller rate limiting.
      # Safe here because only the proxy can reach the published port; off
      # by default because a forgeable key gives an attacker unlimited
      # buckets, which is worse than one shared limit.
      TRUST_PROXY_HEADERS: "1"
      DATABASE_PATH: /data/store.db
      SESSION_TTL_MS: "2592000000"    # 30 days before a fresh Plex sign-in
      REVALIDATE_AFTER_MS: "86400000" # revocation window: 1 day

    volumes:
      # Sessions, per-user store settings and encrypted Plex tokens.
      # Back this up like a credential store, because that is what it is.
      - /DATA/AppData/volkbuster/data:/data
      # Drop a logo.svg in here and restart to rebrand — no rebuild needed.
      - /DATA/AppData/volkbuster/brand:/app/dist/user-assets

    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3355/healthz"]
      interval: 30s
      timeout: 5s
      # First boot builds the 3D scene before the gate opens. Do not shorten
      # this — a shorter period marks the container unhealthy mid-build and
      # ZimaOS will restart it in a loop that never completes a boot.
      start_period: 40s
      retries: 3

# ZimaOS app metadata. It has to sit at the top level: ZimaOS reads the app's
# title and icon from here and nowhere else, and asks for a project name when
# the title is missing. Other Docker hosts ignore x- keys.
x-casaos:
  author: self
  category: Media
  main: volkbusters
  port_map: "3355"
  scheme: http
  index: /
  title:
    custom: Volkbusters
    en_us: Volkbusters
  # Served straight from the repo so the tile matches the app. Point this at
  # your own fork once it is pushed — GitHub raw URLs are what ZimaOS reads.
  icon: https://raw.githubusercontent.com/vanticstudio/Volk-Buster-Video/refs/heads/main/deploy/icon/volkbuster-icon-512.png
  description:
    en_us: >-
      Your Plex library as a walkable 1990s video rental store. Access is
      gated on Plex library sharing: anyone you have shared a library with
      can sign in, and nobody else can.
