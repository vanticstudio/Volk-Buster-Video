# VolkBuster Video — ZimaOS "Install Custom App" → YAML tab.
#
# Paste this whole file into the YAML tab, fill the three secrets, Install.
#
# BUILD THE IMAGE FIRST. ZimaOS pulls images; it cannot build from a Dockerfile,
# and there is no published image until you push a v*.*.* tag and make the GHCR
# package public. Over SSH to the NAS:
#
#   sudo git clone https://github.com/vanticstudio/Volk-Buster-Video.git /DATA/volkbuster-src
#   sudo env DOCKER_CONFIG=/DATA/.docker docker build -t volkbuster-video:latest /DATA/volkbuster-src
#
# This file then finds it locally — no registry involved.
#
# TO UPDATE after making changes:
#
#   sudo /DATA/volkbuster-src/deploy/update.sh --image-only
#
# then hit restart on the app in ZimaOS. --image-only rebuilds the image and
# stops there, leaving the container to ZimaOS, which owns it once the app was
# installed through the UI. Letting both manage the same container is how you
# end up with two of them fighting over port 3355.
#
# Your data survives every update: sessions, the chosen Plex server and the
# generated keys live in the volume below, which is reattached rather than
# recreated. Nobody signs in again and setup is not repeated.
#
# ONE PUBLIC PORT. The store app runs on loopback inside the container and is
# reachable only through the front door, which checks a Plex session first. The
# store has no authentication of its own, so do NOT add a mapping for 1420 —
# that would serve your whole library to anyone who found the port.

name: volkbuster

services:
  volkbuster:
    image: volkbuster-video:latest
    container_name: volkbuster
    restart: unless-stopped
    init: true

    ports:
      - "3355:3355"

    environment:
      # NOTHING IS REQUIRED HERE. The session-signing and token-encryption keys
      # are random bytes the server generates on first boot and keeps beside the
      # database — a machine makes better ones than a human can, and there is
      # nothing to paste, leak or lose. Which Plex server the store gates on is
      # chosen in the browser, from a list of the servers you own.
      #
      # After installing, read the setup code from the log:
      #   docker logs volkbuster | grep -i "setup code"
      # then open the app and follow it.
      #
      # Set PLEX_MACHINE_ID / SESSION_SECRET / TOKEN_ENCRYPTION_KEY here only if
      # you manage secrets externally; env wins over the generated values.
      PORT: "3355"
      APP_PORT: "1420"
      DATABASE_PATH: /data/store.db
      SESSION_TTL_MS: "2592000000"    # 30 days before a fresh Plex sign-in
      REVALIDATE_AFTER_MS: "86400000" # revocation window: 1 day

    volumes:
      # Sessions, per-user store settings and encrypted Plex tokens.
      # Back this up like a credential store, because that is what it is.
      - /DATA/AppData/volkbuster/data:/data
      # Drop a logo.svg in here and restart to rebrand — no rebuild needed.
      - /DATA/AppData/volkbuster/brand:/app/dist/user-assets

    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3355/healthz"]
      interval: 30s
      timeout: 5s
      # First boot builds the 3D scene before the gate opens. Do not shorten
      # this — a shorter period marks the container unhealthy mid-build and
      # ZimaOS will restart it in a loop that never completes a boot.
      start_period: 40s
      retries: 3

    # ZimaOS app-store metadata. Harmless to other Docker hosts, which ignore
    # unknown x- keys.
    x-casaos:
      author: self
      category: Media
      main: volkbuster
      port_map: "3355"
      # Served straight from the repo so the tile matches the app. Point this at
      # your own fork once it is pushed — GitHub raw URLs are what ZimaOS reads.
      icon: https://raw.githubusercontent.com/vanticstudio/Volk-Buster-Video/main/deploy/icon/volkbuster-icon-256.png
      scheme: http
      index: /
      description:
        en_us: >-
          Your Plex library as a walkable 1990s video rental store. Access is
          gated on Plex library sharing: anyone you have shared a library with
          can sign in, and nobody else can.
