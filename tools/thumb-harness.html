<!doctype html>
<!--
  Cover-thumbnail harness.

  The settings drawer previews each `bb_cover_*` value with a 480x270 PNG in
  public/setting-thumbs/, and those previews are box wraps carrying the house
  wordmark — so they go stale the moment a fork rebrands. Upstream generated
  them with tools/gen_setting_thumbs.mjs, which is absent from this checkout;
  this page plus tools/gen-cover-thumbs.mjs replaces it.

  It renders from COVER_VARIANTS — the same table the settings drawer builds its
  cycle from — rather than a list written out here. That is deliberate: the
  hardcoded version missed the DVD 'blue' variant entirely, so one option in the
  drawer had no preview at all. Driving both from one source means a variant
  cannot be offered without a thumbnail again.

  Served by `vite dev` so the TypeScript modules resolve as-is. Driven by
  Puppeteer; not part of the app and never shipped in a build.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Cover thumb harness</title>
<style>body { margin: 0; background: #202020; }</style>
</head>
<body>
<script type="module">
import { COVER_VARIANTS } from '/src/video-case.ts';
import { ensureWrapFontsLoaded } from '/src/logo-wrap.ts';
import { getActiveLogoSpec } from '/src/logo-spec.ts';
import { getActiveTheme } from '/src/themes.ts';
import { bundledFontsReady } from '/src/bundled-fonts.ts';

const W = 480, H = 270;

/**
 * Fit a wrap canvas into the thumbnail frame.
 *
 * "Contain", not "cover": a wrap is far wider than 16:9 and cropping it would
 * cut the wordmark, which is the entire subject of these thumbnails. The
 * backdrop matches the drawer's surround so the letterboxing reads as frame
 * rather than as a rendering fault.
 */
function frame(src) {
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#202020';
  ctx.fillRect(0, 0, W, H);
  const scale = Math.min(W / src.width, H / src.height);
  const w = src.width * scale, h = src.height * scale;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, (W - w) / 2, (H - h) / 2, w, h);
  return out;
}

async function run() {
  // The wrap painters resolve their face through the brand font stack, and a
  // face landing late bakes the wrong glyph metrics into the canvas
  // permanently — the same ordering rule the real boot follows.
  await bundledFontsReady();
  await new Promise((r) => ensureWrapFontsLoaded(getActiveLogoSpec(getActiveTheme()), r));

  const out = {};
  for (const medium of Object.keys(COVER_VARIANTS)) {
    for (const variant of COVER_VARIANTS[medium]) {
      // Only procedurally drawn wraps are ours to regenerate; a user-supplied
      // drop-in cover image is theirs and is left alone.
      if (typeof variant.procedural !== 'function') continue;
      const canvas = variant.procedural(medium);
      out[`bb_cover_${medium}--${variant.id}`] = frame(canvas).toDataURL('image/png');
    }
  }
  window.__thumbs = out;
  document.title = 'ready';
}

run().catch((e) => {
  window.__thumbError = String((e && e.stack) || e);
  document.title = 'error';
});
</script>
</body>
</html>
